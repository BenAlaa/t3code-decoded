version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      astro-book-engine:
        patterns:
          - astro
          - "@astrojs/*"
      search-and-diagrams:
        patterns:
          - pagefind
          - mermaid
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
